<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial;
            max-width: 600px;
            margin: 50px auto;
            background-color: #f5f5f5 ;
            padding: 20px;
        }
        h1 {
            color: #2E75B6;
            text-align: center;
        }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #2E75B6 ;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            background: #2E75B6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #1a5a9a; }
        .task {
            background: white;
            padding: 15px 20px;
            margin: 10px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);

        }
        .done {
            text-decoration: line-through;
            color: gray;
        }
        .complete {
            color: green;
            margin-right: 15px;
            text-decoration: none;
            font-weight: bold;
        }
        .delete {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }
        .count {
            color: gray;
            font-size: 14px;
            text-align: center;
        }
        .empty {
            text-align: center;
            color: gray;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <h1>To-Do List</h1>

    <!-- Add task form-->
     <form action="/add" method="POST">
        <div class="form-group">
            <input type="text" name="task" placeholder="Enter a new task....">
            <button type="submit">Add Task</button>
        </div>
     </form>

     <!-- Task count-->
      <p class="count">Total task: {{ todos|length }}</p>

     <!-- Task list-->
      {% for todo in todos %}
      <div class="task">
        <span class="{{ 'done' if todo[2] else '' }}">
            {{ todo[1] }}
        </span>
        <div>
            {% if not todo[2] %}
            <a href="/complete/{{ todo[0] }}" class="complete">Done</a>
            {% endif %}
            <a href="/delete/{{ todo[0] }}" class="delete">Delete</a>
        </div>
      </div>
      {% endfor %}

      {% if not todos %}
      <p style="color: gray; text-align: center;"> No tasks yet! Add one above.</p>
      {% endif %}


</body>
</html>
